<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook and Google</title>

    <style>
        .container {
            width: 32px;
            padding: 16px;
        }

        /* CSS Reset */
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .row {
            height: 32px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 24px;
        }

        button {
            width: 100px;
            height: 32px;
            border-radius: 8px;
            background-color: aquamarine;
        }

        a {
            color: rgb(30, 31, 27);
        }

        .boxes {
            display: flex;
            gap: 20px;
        }

        .box1 {
            width: 250px;
            padding: 20px;
            border: 1px solid black;
        }

        .box2 {
            width: 250px;
            padding: 20px;
            border: 1px solid black;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="row">
            <button>
                <a href="https://www.facebook.com">Facebook</a>
            </button>
        </div>

        <div class="row">
            <button>
                <a href="https://www.google.com">Google</a>
            </button>
        </div>

        <div class="boxes">

            <div class="box1">
                <h2>Box 1</h2>
                <p>This is some content inside Box 1.</p>
            </div>

            <div class="box2">
                <h2>Box 2</h2>
                <p>This is some content inside Box 2.</p>
            </div>

        </div>

</body>
</html>

    </div>

</body>
</html>
